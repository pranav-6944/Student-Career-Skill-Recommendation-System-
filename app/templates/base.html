<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}CareerPath AI{% endblock %}</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4F46E5',
            'primary-hover': '#4338CA',
            secondary: '#7C3AED',
            tertiary: '#0EA5E9',
            success: '#10B981',
            warning: '#F59E0B',
            error: '#EF4444',
            surface: '#F8FAFC',
            'card-bg': '#FFFFFF',
            border: '#E2E8F0',
            'text-primary': '#0F172A',
            'text-secondary': '#475569',
            'text-muted': '#94A3B8',
          },
          fontFamily: {
            headline: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', sans-serif; }
    .skill-chip-matched { background:#DCFCE7; color:#16A34A; border:1px solid #BBF7D0; }
    .skill-chip-missing  { background:#FEF3C7; color:#D97706; border:1px solid #FDE68A; }
    .skill-chip-neutral  { background:#EEF2FF; color:#4338CA; border:1px solid #C7D2FE; }
    .progress-bar-high   { background: linear-gradient(90deg, #10B981, #059669); }
    .progress-bar-med    { background: linear-gradient(90deg, #F59E0B, #D97706); }
    .progress-bar-low    { background: linear-gradient(90deg, #EF4444, #DC2626); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface text-text-primary font-body antialiased">

  {% block body %}{% endblock %}

  <!-- Flash Messages -->
  <script>
    // Auto-dismiss flash messages
    setTimeout(() => {
      document.querySelectorAll('[data-flash]').forEach(el => {
        el.style.transition = 'opacity 0.5s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 500);
      });
    }, 4000);
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
